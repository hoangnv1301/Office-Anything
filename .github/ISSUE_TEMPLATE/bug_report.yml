name: Bug report
description: Report a problem with Office-Anything
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Office-Anything bugs. Include enough detail for someone else to reproduce the issue.
        **Security issues go to a private advisory, not here** (see SECURITY.md).

        Please write your issue in English.

  - type: dropdown
    id: where
    attributes:
      label: Where were you using Office-Anything?
      description: Where you saw the bug.
      options:
        - A slash command (/desk-*)
        - A hook (a write or command blocked or let through)
        - A check (node checks/run.mjs)
        - A desk or lead session
        - The board
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: The machine the office runs on.
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      description: Only for a desk or lead session.
      options:
        - Orca
        - Terminal.app
        - iTerm2
        - VS Code
        - Other
        - Not sure
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Office-Anything version
      description: From `/desk-status`, or `version` in `.claude-plugin/plugin.json`.
      placeholder: 0.32.2
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the bug in your own words. Include a short summary, reproduction steps, and anything else that seems relevant.
      placeholder: |
        Short summary:
        /desk-fire chat refused with ... although nothing depends on chat

        What happened?

        How can we reproduce it?
        1. ...
        2. ...
        3. ...

        Anything else that might help (the output of `node checks/run.mjs`, with anything private removed):
    validations:
      required: true
