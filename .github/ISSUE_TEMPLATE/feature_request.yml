name: Feature request
description: Suggest an improvement for Office-Anything
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new features or workflow improvements.

        Please write your issue in English.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today? Include a short summary here too.
      placeholder: A desk can be fired while another desk still hands it work.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want to see
      placeholder: /desk-fire refuses while another desk depends on it, naming that desk.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Workarounds, related tools, mockups, or anything else that helps
    validations:
      required: false
